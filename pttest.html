<!DOCTYPE html>
<html>
<head>
  <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host) -->
  <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/polytrack/">

  <!-- Make the cross-origin Web Worker same-origin: create a blob worker that importScripts the real
       worker from jsDelivr and rewrites its relative ammo.wasm loads to absolute jsDelivr URLs. -->
  <script>
    (function(){
      var BASE = "https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/polytrack/";
      var OrigWorker = window.Worker;
      window.Worker = function(url, opts){
        var absUrl = new URL(url, document.baseURI).href;
        var src = [
          'var BASE=' + JSON.stringify(BASE) + ';',
          'function abs(u){',
          '  if(typeof u!=="string") return u;',
          '  if(/ammo\\.wasm\\.wasm/.test(u)) return BASE+"lib/ammo.wasm.wasm";',
          '  if(/ammo\\.wasm\\.js/.test(u)) return BASE+"lib/ammo.wasm.js";',
          '  if(/^(https?:|blob:|data:)/.test(u)) return u;',
          '  return BASE + u.replace(/^\\.?\\//,"");',
          '}',
          'var _is=self.importScripts.bind(self);',
          'self.importScripts=function(){return _is.apply(self,Array.prototype.map.call(arguments,abs));};',
          'if(self.fetch){var _f=self.fetch.bind(self);self.fetch=function(u,o){return _f(typeof u==="string"?abs(u):u,o);};}',
          'var _open=XMLHttpRequest.prototype.open;',
          'XMLHttpRequest.prototype.open=function(){if(typeof arguments[1]==="string")arguments[1]=abs(arguments[1]);return _open.apply(this,arguments);};',
          'importScripts(' + JSON.stringify(absUrl) + ');'
        ].join('\n');
        var blob = new Blob([src], {type:"application/javascript"});
        return new OrigWorker(URL.createObjectURL(blob), opts);
      };
      try{ window.Worker.prototype = OrigWorker.prototype; }catch(e){}
    })();
  </script>

  <!-- force crossOrigin on all images so THREE.js textures from jsDelivr don't taint the canvas -->
  <script>
    (function(){
      try{
        var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
        Object.defineProperty(HTMLImageElement.prototype, "src", {
          configurable: true,
          get: function(){ return d.get.call(this); },
          set: function(v){ try{ if(!this.crossOrigin) this.crossOrigin = "anonymous"; }catch(e){} d.set.call(this, v); }
        });
      }catch(e){}
    })();
  </script>

  <link rel="manifest" href="manifest.json" />
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <title>Denton ISD</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; background:#7fa8d6; overflow:hidden; }
  </style>
</head>
<body>
  <!-- corner tag: fixed top-left, rounded pill -->
  <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">PolyTrack - Made by P:D</div>

  <canvas id="screen"></canvas>
  <div id="ui"></div>
  <div id="transition-layer"></div>

  <script type="module" src="main.bundle.js" defer></script>
</body>
</html>
