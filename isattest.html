<!DOCTYPE html>
<html>
    <head>
        <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host) -->
        <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/isat/">

        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no">

        <!-- Force crossOrigin on every image so RPG Maker MV's PIXI WebGL textures don't taint when
             loaded cross-origin from jsDelivr (which sends Access-Control-Allow-Origin: *).
             (MV's Bitmap sets image.src without crossOrigin; assets here are unencrypted PNGs.) -->
        <script>
          (function(){
            var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
            Object.defineProperty(HTMLImageElement.prototype, "src", {
              set: function(v){ try { this.crossOrigin = "anonymous"; } catch(e){} d.set.call(this, v); },
              get: function(){ return d.get.call(this); },
              configurable: true
            });
          })();
        </script>

        <!-- NOTE: the upstream port injected "?test=1" onto every fetch/XHR/script src, resolving each
             against location.href — that bypasses the base href and breaks jsDelivr loading, and the
             param isn't needed (playtest 'test' mode is gated behind Utils.isNwjs()). So it's removed. -->

        <!-- Lock the tab title: RPG Maker MV sets document.title = $dataSystem.gameTitle at boot.
             Make the title setter a no-op so the tab stays "Denton ISD". -->
        <script>
          (function(){
            var TITLE = "Denton ISD";
            try {
              Object.defineProperty(Document.prototype, "title", {
                get: function(){ return TITLE; },
                set: function(){ /* ignore the game's title; keep Denton ISD */ },
                configurable: true
              });
            } catch(e){
              // fallback: keep re-asserting if the property can't be redefined
              setInterval(function(){ if (document.title !== TITLE) document.title = TITLE; }, 500);
            }
          })();
        </script>

        <script>
            fetch("data/Translations.json").then(res => res.json()).then(json => {
                window.$dataTranslations = json;
            });
        </script>

        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        <title>Denton ISD</title>

        <style>
          html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#7fa8d6; }
        </style>
    </head>
    <body style="background-color: #7fa8d6">
        <!-- corner tag: fixed top-left, rounded pill -->
        <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">In Stars and Time - Made by Project: Daylight</div>

        <script type="text/javascript" src="js/libs/pixi.js"></script>
        <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
        <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
        <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
        <script type="text/javascript" src="js/libs/lz-string.js"></script>
        <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
        <script type="text/javascript" src="js/rpg_core.js"></script>
        <script type="text/javascript" src="js/rpg_managers.js"></script>
        <script type="text/javascript" src="js/rpg_objects.js"></script>
        <script type="text/javascript" src="js/rpg_scenes.js"></script>
        <script type="text/javascript" src="js/rpg_sprites.js"></script>
        <script type="text/javascript" src="js/rpg_windows.js"></script>
        <script type="text/javascript" src="js/plugins.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
    </body>
    <script>
        // full screen the game (4:3 fit) ------------------------------------------------
        function applycanvasmode() {
            let w = 0;
            let h = 0;
            let maxW = window.innerWidth;
            let maxH = window.innerHeight;
            if ((maxW * 0.75) > maxH) {
                h = maxH;
                w = Math.floor((maxH / 3) * 4);
            } else {
                w = maxW;
                h = Math.floor((maxW / 4) * 3);
            }
            let gc = document.querySelector("#GameCanvas");
            let gv = document.querySelector("#GameVideo");
            let uc = document.querySelector("#UpperCanvas");
            if (gc) { gc.style.width = w + "px"; gc.style.height = h + "px"; }
            if (gv) { gv.style.width = w + "px"; gv.style.height = h + "px"; }
            if (uc) { uc.style.width = w + "px"; uc.style.height = h + "px"; }
        }
        setInterval(applycanvasmode, 100);

        // support mobile ----------------------------------------------------------------
        (function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (!isMobile) {
                return;
            }
            let i = setInterval(function() {
                if (window.fullSetupComplete) {
                    let zoneStatic = document.createElement("div");
                    zoneStatic.style = "position: fixed; bottom: 0; left: 0; z-index: 9999; width: 500px; height: 500px;";
                    let internal = document.createElement("div");
                    internal.style = "position: relative; width: 100%; height: 100%;"
                    zoneStatic.appendChild(internal);
                    let joystick = nipplejs.create({
                        mode: 'semi',
                        zone: internal,
                        color: 'red',
                        catchDistance: 30
                    });
                    setTimeout(function() {
                        joystick.on("dir", function(e, data) {
                            let dirs = ["up", "down", "left", "right"];
                            for (let o of dirs) {
                                if (o !== data.direction.angle) {
                                    fakeInput.up(o);
                                } else {
                                    fakeInput.down(o);
                                }
                            }
                        });
                        joystick.on("end", function() {
                            let dirs = ["up", "down", "left", "right"];
                            for (let o of dirs) {
                                fakeInput.up(o);
                            }
                        });
                    }, 100);
                    document.body.appendChild(zoneStatic);
                    const createButton = (text, key, bottom, right, bgColor) => {
                        let button = document.createElement("div");
                        button.style = `
                    position: fixed;
                    bottom: ${bottom};
                    right: ${right};
                    width: 10vw;
                    height: 10vw;
                    background: ${bgColor};
                    color: white;
                    touch-action: none;
                    z-index: 999999;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-family: sans-serif;
                    font-size: 3vw;
                    border-radius: 50%;
                `;
                        button.innerText = text;
                        button.addEventListener("touchstart", function(e) {
                            e.preventDefault();
                            fakeInput.down(key);
                        });
                        button.addEventListener("touchend", function(e) {
                            e.preventDefault();
                            fakeInput.up(key);
                        });
                        document.body.appendChild(button);
                        return button;
                    };

                    createButton("OK", "ok", "5vw", "5vw", "#0f08");
                    createButton("ESC", "escape", "5vw", "15vw", "#f008");
                    createButton("TAG", "tag", "15vw", "15vw", "#00f8");
                    createButton("RUN", "shift", "15vw", "5vw", "#f0f8");
                    clearInterval(i);
                }
            }, 100);
        })();
    </script>
</html>
