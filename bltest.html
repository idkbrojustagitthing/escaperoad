<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- base href trick: relative paths resolve to the game's repo on jsDelivr (Cloudflare-only host) -->
    <base href="https://testingcf.jsdelivr.net/gh/aDiesmos/livediesmos/bitlife/">

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Denton ISD</title>
    <link rel="stylesheet" href="style.css" />
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <style>
      /* Keep the game's own width:62vh portrait constraint (from repo style.css) for mobile format,
         but LEFT-ALIGN it (margin:0, not auto) so the canvas sits at x=0 — this old Unity build
         doesn't account for a horizontal offset, so centering breaks clicking. Soft blue fills the rest. */
      html { background:#7fa8d6 !important; margin:0 !important; }
      body { background:#7fa8d6 !important; margin:0 !important; }
    </style>
    <script>
      var unityInstance = UnityLoader.instantiate("gameContainer", "https://testingcf.jsdelivr.net/gh/aDiesmos/livediesmos/bitlife/Build/BitLife.json", {
        onProgress: UnityProgress,
        Module: {
          onRuntimeInitialized: function () { UnityProgress(unityInstance, "complete"); },
        },
      });
    </script>
  </head>
  <body>
    <!-- corner tag: fixed top-left, rounded pill -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">BitLife - Made by P:D</div>

    <div class="webgl-content">
      <div id="gameContainer" style="width: 100%; height: 100%;"></div>
    </div>
  </body>
</html>
