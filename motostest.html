<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host) -->
    <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/motox3m/">

    <!-- Force the Canvas 2D renderer (block WebGL) so cross-origin jsDelivr images don't taint WebGL textures -->
    <script>
      (function(){
        var _gc = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(type){
          if(type === "webgl" || type === "experimental-webgl" || type === "webgl2"){ return null; }
          return _gc.apply(this, arguments);
        };
      })();
    </script>

    <!-- Force crossOrigin on every image so cross-origin (jsDelivr) images work with canvas readback -->
    <script>
      (function(){
        try{
          var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
          Object.defineProperty(HTMLImageElement.prototype, "src", {
            configurable: true,
            get: function(){ return d.get.call(this); },
            set: function(v){ try{ if(!this.crossOrigin) this.crossOrigin = "anonymous"; }catch(e){} d.set.call(this, v); }
          });
        }catch(e){}
      })();
    </script>

    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
    <title>Denton ISD</title>
    <link rel="stylesheet" href="assets/css/app.css" type="text/css" />
    <link rel="shortcut icon" href="download.jpeg">
    <style>
      /* soft blue background behind the game */
      html, body { margin:0; padding:0; width:100%; height:100%; background:#7fa8d6; }
    </style>
  </head>
  <body>
    <!-- corner tag: fixed top-left, rounded pill -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Moto X3M - Made by P:D</div>

    <!-- containers the game requires -->
    <div id="content"></div>
    <div id="orientation"></div>
    <div id="loader">Loading ...</div>

    <script type="text/javascript" src="assets/box2dweb/nape.min.js">
      var nape = "nape.min.js";
    </script>
    <script type="text/javascript" src="motox3m.min.js"></script>

    <!-- Auto-start (no ads): the game waits in its boot state for the ad SDK's SDK_GAME_START event. -->
    <script>
      (function(){
        function fire(){ var c = document.getElementById("content"); if(c){ try{ c.dispatchEvent(new Event("SDK_GAME_START")); }catch(e){} } }
        // stub ad calls so mid-game ad requests resume instantly instead of hanging
        window.sdk = window.sdk || {};
        window.sdk.showBanner = function(){ setTimeout(fire, 30); };
        window.sdk.showAd = window.sdk.showAd || function(){ setTimeout(fire, 30); };
        // fire SDK_GAME_START until the game leaves the boot state (its listener registers during boot)
        var n = 0, iv = setInterval(function(){
          var advanced = false;
          try{ advanced = !!(window.PIXI && PIXI.game && PIXI.game.state && PIXI.game.state.current && PIXI.game.state.current !== "boot"); }catch(e){}
          if(advanced || ++n > 12){ clearInterval(iv); return; }
          fire();
        }, 400);
        window.addEventListener("load", fire);
      })();
    </script>
  </body>
</html>
