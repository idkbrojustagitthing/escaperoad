<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host) -->
  <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/escaperoad/">
  <title>Denton ISD</title>

  <!-- (1) Block the azgames promo/embed SDK that the Unity build loads remotely and uses to overlay/replace the game -->
  <script>
    (function(){
      var BAD = /gmsoftsdk|azgame\.io|1games\.io|wgplayer|pagead2\.googlesyndication/i;
      var _create = Document.prototype.createElement;
      Document.prototype.createElement = function(tag){
        var el = _create.call(this, tag);
        if(String(tag).toLowerCase()==="script"){
          try{
            var d = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype,"src");
            Object.defineProperty(el,"src",{configurable:true,
              get:function(){ return d.get.call(el); },
              set:function(v){ if(BAD.test(String(v))) return; d.set.call(el, v); }});
            var _sa = el.setAttribute.bind(el);
            el.setAttribute = function(n,v){ if(String(n).toLowerCase()==="src" && BAD.test(String(v))) return; return _sa(n,v); };
          }catch(e){}
        }
        return el;
      };
      ["appendChild","insertBefore"].forEach(function(m){
        var orig = Node.prototype[m];
        Node.prototype[m] = function(node){
          try{ if(node && node.tagName==="SCRIPT" && BAD.test(String(node.src||(node.getAttribute&&node.getAttribute("src"))||""))) return node; }catch(e){}
          return orig.apply(this, arguments);
        };
      });
    })();
  </script>

  <!-- (2) Reassemble the >20MB Unity files from sub-20MB chunks on jsDelivr, transparently to Unity's loader -->
  <script>
    (function(){
      var PARTS = {
        "escape-road-v25011401.wasm.unityweb": ["25011401/Build/parts/wasm.part0","25011401/Build/parts/wasm.part1","25011401/Build/parts/wasm.part2"],
        "escape-road-v25011401.data.unityweb": ["25011401/Build/parts/data.part0","25011401/Build/parts/data.part1"]
      };
      var _fetch = window.fetch.bind(window);
      window.fetch = function(input, init){
        var url = (typeof input === "string") ? input : (input && input.url) || "";
        for (var name in PARTS){
          if (url.indexOf(name) !== -1){
            var parts = PARTS[name];
            return Promise.all(parts.map(function(p){
              return _fetch(new URL(p, document.baseURI).href).then(function(r){
                if(!r.ok) throw new Error("chunk "+p+" -> "+r.status);
                return r.arrayBuffer();
              });
            })).then(function(buffers){
              var total = buffers.reduce(function(a,b){return a+b.byteLength;},0);
              var merged = new Uint8Array(total), off=0;
              buffers.forEach(function(b){ merged.set(new Uint8Array(b), off); off += b.byteLength; });
              return new Response(merged, { status:200, headers:{
                "Content-Type":"application/octet-stream",
                "Content-Length": String(total)
              }});
            });
          }
        }
        return _fetch(input, init);
      };
    })();
  </script>

  <link rel="stylesheet" href="25011401/theme/game.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#7fa8d6; }
    #unity-container { position:absolute; top:0; left:0; width:100%; height:100%; }
    #unity-canvas { width:100%; height:100%; display:block; }
    #loadingBlock {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; background:#7fa8d6;
      z-index:1000; font-family:Fredoka, Arial, sans-serif; color:#fff;
    }
    #loadingBlock img { max-width:280px; margin-bottom:22px; }
    #loadingBar { width:300px; max-width:70vw; height:16px; background:rgba(255,255,255,.35); border-radius:10px; overflow:hidden; }
    #progress_fill { width:0%; height:100%; background:#fff; border-radius:10px; transition:width .15s; }
    .gameloader-progress-info { margin-top:12px; font-size:15px; letter-spacing:.5px; }
  </style>

  <script>
    var buildUrl = "25011401/Build";
    var versionFolder = "25011401/";
    var loaderUrl = buildUrl + "/escape-road-v25011401.loader.js";
    var config = {
      dataUrl: buildUrl + "/escape-road-v25011401.data.unityweb",
      frameworkUrl: buildUrl + "/escape-road-v25011401.framework.js.unityweb",
      codeUrl: buildUrl + "/escape-road-v25011401.wasm.unityweb",
      streamingAssetsUrl: versionFolder + "StreamingAssets",
      companyName: "azgames.io",
      productName: "Escape Road",
      productVersion: "25011401",
      pubId: ""
    };
    config.gameId = "escape-road";
    config.eventLog = true;
    config.buildAPI = "https://event.azgame.io/apiaz/event";
    var currentDate = new Date();
    var endLogDate = new Date("2025-03-08T07:31:48.701Z");
    if (currentDate > endLogDate) { config.eventLog = false; }
    config.enableMoreGame = "no";
    config.enablePromotion = false;
  </script>
</head>

<body>
  <!-- corner tag: fixed top-left, rounded pill -->
  <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Escape Road - Made by P:D</div>

  <div id="unity-container" style="display:none;">
    <canvas id="unity-canvas"></canvas>
  </div>

  <div id="loadingBlock">
    <img src="25011401/logo.png" alt="">
    <div id="loadingBar"><div id="progress_fill"></div></div>
    <div class="gameloader-progress-info">Game Loading...</div>
  </div>

  <script>
    var container = document.getElementById("unity-container");
    var canvas = document.getElementById("unity-canvas");
    var loadingBar = document.getElementById("loadingBlock");
    var progressElement = document.getElementById("progress_fill");
    var progress_text = document.querySelector(".gameloader-progress-info");

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        var pct = Math.round(progress * 100);
        progressElement.style.width = (100 * progress) + "%";
        if (progress_text) progress_text.innerText = progress < 0.99 ? ("Downloading file: " + pct + "%") : "Game Loading ...";
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        setTimeout(function () {
          loadingBar.style.display = "none";
          window.focus();
        }, 800);
        container.style.display = "block";
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
