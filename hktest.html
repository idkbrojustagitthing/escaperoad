<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host).
         SHA-pinned to web-ports/hollow-knight (immutable). Not self-hosted (~860MB). -->
    <base href="https://testingcf.jsdelivr.net/gh/web-ports/hollow-knight@1b7d1e452f66268486e9a000a6006b4e8eb527bc/">
    <script>
      // Chromebook fix: never let a game/engine error pop a "This page says..." dialog, and drop the
      // Content-Type header so analytics XHRs don't hit a CORS preflight that jsDelivr rejects.
      window.alert = function(m){ try{ console.log("[alert suppressed]", m); }catch(e){} };
      window.confirm = function(){ return true; };
      window.prompt = function(){ return null; };
      (function(){
        var _sh = XMLHttpRequest.prototype.setRequestHeader;
        XMLHttpRequest.prototype.setRequestHeader = function(name, value){
          if (String(name).toLowerCase() === "content-type") return;
          return _sh.apply(this, arguments);
        };
      })();
    </script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Denton ISD</title>
    <script>(function(){var T="Denton ISD";try{Object.defineProperty(Document.prototype,"title",{get:function(){return T;},set:function(){},configurable:true});}catch(e){setInterval(function(){if(document.title!==T)document.title=T;},500);}})();</script>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#7fa8d6; }
      #unity-container { width:100%; height:100%; position:fixed; top:0; left:0; background:#7fa8d6;
        display:flex; align-items:center; justify-content:center; }
      #unity-canvas { background:#7fa8d6; max-width:100vw; max-height:100vh; }
      #unity-loading-bar { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:none; z-index:10; }
      #unity-mobile-warning { position:absolute; left:50%; top:5%; transform:translateX(-50%); z-index:20; display:none; background:#000; color:#fff; padding:8px; }
      #loading-text {
        position:fixed; top:20px; left:0; right:0; text-align:center;
        color:#fff; font-size:48px; font-family:cursive; font-weight:bold; z-index:9999; pointer-events:none;
        background: linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);
        background-size:400% 400%; -webkit-background-clip:text; background-clip:text;
        -webkit-text-fill-color:transparent; animation:rainbow 3s ease infinite;
      }
      @keyframes rainbow { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
    </style>
  </head>
  <body>
    <!-- corner tag: fixed top-left, rounded pill -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Hollow Knight - Made by Project: Daylight</div>

    <div id="loading-text">LOADING...</div>
    <div id="unity-container" hidden>
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-mobile-warning">WebGL builds are not supported on mobile devices.</div>
    </div>
    <script>
      var loadingText = document.querySelector("#loading-text");
      var partsDone = 0;
      var totalParts = 42 + 2;

      // Disk-backed, concurrency-limited, retried part fetch -> no OOM on low-RAM Chromebooks
      // (the ~840MB data never sits in RAM as ArrayBuffers) and rides out jsDelivr rate-limit 403s.
      async function fetchBlob(url) {
        var attempts = 0;
        while (true) {
          try {
            var response = await fetch(url);
            if (!response.ok) throw new Error("Fetch failed: " + url + " (" + response.status + ")");
            var b = await response.blob();
            partsDone++;
            if (loadingText) loadingText.textContent = "LOADING... " + partsDone + " / " + totalParts + " parts";
            return b;
          } catch (e) {
            attempts++;
            if (attempts >= 8) throw e;
            await new Promise(function(r){ setTimeout(r, 600 * attempts); });
          }
        }
      }
      async function mapLimit(items, limit, fn) {
        var results = new Array(items.length); var idx = 0;
        async function worker(){ while (idx < items.length){ var i = idx++; results[i] = await fn(items[i]); } }
        var ws = []; for (var k = 0; k < Math.min(limit, items.length); k++) ws.push(worker());
        await Promise.all(ws); return results;
      }
      async function mergeFiles(fileParts, cacheKey, mime, minBytes) {
        var cache = null;
        try { if (self.caches) cache = await caches.open("hk-cache-v1"); } catch (e) {}
        var blobOpts = mime ? { type: mime } : undefined;
        if (cache) {
          var cached = await cache.match(cacheKey);
          if (cached) {
            var cb = await cached.blob();
            if (!minBytes || cb.size >= minBytes) return URL.createObjectURL(mime ? new Blob([cb], blobOpts) : cb);
            try { await cache.delete(cacheKey); } catch (e) {}
          }
        }
        var blobs = await mapLimit(fileParts, 6, fetchBlob);
        var merged = new Blob(blobs, blobOpts);
        if (cache && (!minBytes || merged.size >= minBytes)) {
          try { await cache.put(cacheKey, new Response(merged)); } catch (e) {}
        }
        return URL.createObjectURL(merged);
      }
      function getParts(file, start, end) {
        var parts = []; for (var i = start; i <= end; i++) parts.push(file + ".part" + i); return parts;
      }

      (async () => {
        const dataUrl = await mergeFiles(getParts("Build/hk.data", 1, 42), "hk.data", null, 750 * 1024 * 1024);
        const wasmurl = await mergeFiles(getParts("Build/hk.wasm", 1, 2), "hk.wasm", "application/wasm", 25 * 1024 * 1024);

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/hk.loader.js";
        var config = {
          dataUrl: dataUrl,
          frameworkUrl: buildUrl + "/hk.framework.js",
          codeUrl: wasmurl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Team Cherry & Truffled",
          productName: "Hollow Knight",
          productVersion: "1.0",
        };
        var container = document.querySelector("#unity-container");
        container.hidden = false;
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          container.className = "unity-mobile";
          config.devicePixelRatio = 1;
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          document.getElementsByTagName('head')[0].appendChild(meta);
          canvas.className = "unity-mobile";
        } else {
          function resizeCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            canvas.style.width = window.innerWidth + "px"; canvas.style.height = window.innerHeight + "px";
          }
          resizeCanvas();
          window.addEventListener('resize', resizeCanvas);
        }

        loadingBar.style.display = "block";
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            if (loadingText) loadingText.remove();
          }).catch((message) => { console.log("[unity load error]", message); });
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
