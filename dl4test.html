<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host).
         Self-hosted in whatver/ducklife4/ (Poki Unity asm.js build; big files split into <20MB parts). -->
    <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/ducklife4/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Denton ISD</title>
    <!-- Lock the tab title so Unity/Poki can't rename it away from Denton ISD. -->
    <script>
      (function(){
        var TITLE = "Denton ISD";
        try { Object.defineProperty(Document.prototype, "title", { get:function(){return TITLE;}, set:function(){}, configurable:true }); }
        catch(e){ setInterval(function(){ if (document.title !== TITLE) document.title = TITLE; }, 500); }
      })();
    </script>

    <!-- Clean self-resolving PokiSDK stub: this is a Poki game whose Unity build calls PokiSDK.*; with
         no real SDK those calls would throw. All no-ops so it runs with no ads/tracking/website chrome. -->
    <script>
      window.PokiSDK = {
        init: function(){ return Promise.resolve(); },
        setDebug: function(){}, setLogging: function(){},
        gameLoadingStart: function(){}, gameLoadingProgress: function(){}, gameLoadingFinished: function(){},
        gameplayStart: function(){}, gameplayStop: function(){},
        commercialBreak: function(){ return Promise.resolve(); },
        rewardedBreak: function(){ return Promise.resolve(false); },
        displayAd: function(e,n,t,o){ if(o)o(true); if(t)t(); }, destroyAd: function(){},
        happyTime: function(){}, captureError: function(){}, customEvent: function(){},
        gameInteractive: function(){}, roundStart: function(){}, roundEnd: function(){},
        getURLParam: function(){ return ""; },
        getLanguage: function(){ return (navigator.language||"en").toLowerCase().split("-")[0]; },
        isAdBlocked: function(){ return false; }, shareableURL: function(){ return Promise.reject(); },
        setPlayerAge: function(){}, enableFullscreen: function(){}, disableFullscreen: function(){},
        muteAd: function(){}, requestFocus: function(){}, releaseFocus: function(){}
      };
    </script>

    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#7fa8d6; }
      #gameContainer {
        width:100%; height:100%; background:#7fa8d6;
        display:flex; align-items:center; justify-content:center; position:relative;
      }
      #gameContainer canvas { display:block; background:#7fa8d6; max-width:100vw; max-height:100vh; }
      #loading-text {
        position:fixed; top:20px; left:0; right:0; text-align:center;
        color:#fff; font-size:48px; font-family:cursive; font-weight:bold; z-index:9999; pointer-events:none;
        background: linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);
        background-size:400% 400%; -webkit-background-clip:text; background-clip:text;
        -webkit-text-fill-color:transparent; animation:rainbow 3s ease infinite;
      }
      @keyframes rainbow { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
    </style>
  </head>
  <body>
    <!-- corner tag: fixed top-left, rounded pill -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Duck Life 4 - Made by Project: Daylight</div>

    <div id="loading-text"
      style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">LOADING...</div>
    <div id="gameContainer"></div>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var loadingText = document.querySelector("#loading-text");
      var partsDone = 0;
      var totalParts = 4 + 2;

      async function fetchBlob(url) {
        var attempts = 0;
        while (true) {
          try {
            var response = await fetch(url);
            if (!response.ok) throw new Error("Fetch failed: " + url + " (" + response.status + ")");
            var b = await response.blob();
            partsDone++;
            loadingText.textContent = "LOADING... " + partsDone + " / " + totalParts + " parts";
            return b;
          } catch (e) {
            attempts++;
            if (attempts >= 8) throw e;
            await new Promise(function(r){ setTimeout(r, 600 * attempts); });
          }
        }
      }

      async function mapLimit(items, limit, fn) {
        var results = new Array(items.length);
        var idx = 0;
        async function worker() { while (idx < items.length) { var i = idx++; results[i] = await fn(items[i]); } }
        var workers = [];
        for (var w = 0; w < Math.min(limit, items.length); w++) workers.push(worker());
        await Promise.all(workers);
        return results;
      }

      async function mergeFiles(fileParts) {
        var blobs = await mapLimit(fileParts, 5, fetchBlob);
        return URL.createObjectURL(new Blob(blobs));
      }

      function getParts(file, start, end) {
        var parts = [];
        for (var i = start; i <= end; i++) parts.push(file + ".part" + i);
        return parts;
      }

      (async () => {
        const dataUrl = await mergeFiles(getParts("Build/WebGL4PokiNew.data.unityweb", 1, 4));
        const codeUrl = await mergeFiles(getParts("Build/WebGL4PokiNew.asm.code.unityweb", 1, 2));
        // Old UnityLoader fetches the (single) data/code files via XHR; redirect those to the merged blobs.
        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          if (typeof url === "string") {
            if (url.includes("WebGL4PokiNew.data.unityweb")) { url = dataUrl; }
            else if (url.includes("WebGL4PokiNew.asm.code.unityweb")) { url = codeUrl; }
          }
          return originalOpen.call(this, method, url, ...rest);
        };
        window.unityGame = UnityLoader.instantiate("gameContainer", "Build/WebGL4PokiNew.json", {
          onProgress: function(_g, p){ if (p >= 1 && loadingText) loadingText.style.display = "none"; }
        });
      })();
    </script>
  </body>
</html>
