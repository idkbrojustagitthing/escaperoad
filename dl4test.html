<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Denton ISD</title>
    <script>
      (function(){
        var TITLE = "Denton ISD";
        try { Object.defineProperty(Document.prototype, "title", { get:function(){return TITLE;}, set:function(){}, configurable:true }); }
        catch(e){ setInterval(function(){ if (document.title !== TITLE) document.title = TITLE; }, 500); }
      })();
    </script>
    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#7fa8d6; }
      #gameFrame { border:0; width:100vw; height:100vh; display:block; background:#7fa8d6; }
    </style>
  </head>
  <body>
    <!-- corner tag: fixed top-left, rounded pill (lives on the OUTER page so the game can't touch it) -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Duck Life 4 - Made by Project: Daylight</div>

    <!-- The game runs inside a SANDBOXED iframe. This does two things that defeat the Poki sitelock:
         (1) the game is now "framed" (window.top !== window.self), which Poki builds require, and
         (2) WITHOUT allow-top-navigation, any attempt by the game to redirect the top window to
             games.poki.com is blocked by the browser, so it just keeps running. -->
    <iframe id="gameFrame"
      sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-fullscreen">
    </iframe>

    <script>
      // Build the inner game-loader document and hand it to the iframe as a blob URL.
      var GAME_HTML = [
        '<!DOCTYPE html><html lang="en-us"><head>',
        '<base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/ducklife4/">',
        '<meta charset="utf-8">',
        '<style>',
        '  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#7fa8d6;}',
        '  #gameContainer{width:100%;height:100%;background:#7fa8d6;display:flex;align-items:center;justify-content:center;position:relative;}',
        '  #gameContainer canvas{display:block;background:#7fa8d6;max-width:100vw;max-height:100vh;}',
        '  #loading-text{position:fixed;top:20px;left:0;right:0;text-align:center;color:#fff;font-size:48px;font-family:cursive;font-weight:bold;z-index:9999;pointer-events:none;',
        '    background:linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);background-size:400% 400%;',
        '    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rainbow 3s ease infinite;}',
        '  @keyframes rainbow{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}',
        '</style>',
        '<scr'+'ipt>',
        '  window.PokiSDK={init:function(){return Promise.resolve();},setDebug:function(){},setLogging:function(){},',
        '    gameLoadingStart:function(){},gameLoadingProgress:function(){},gameLoadingFinished:function(){},',
        '    gameplayStart:function(){},gameplayStop:function(){},commercialBreak:function(){return Promise.resolve();},',
        '    rewardedBreak:function(){return Promise.resolve(false);},displayAd:function(e,n,t,o){if(o)o(true);if(t)t();},',
        '    destroyAd:function(){},happyTime:function(){},captureError:function(){},customEvent:function(){},gameInteractive:function(){},',
        '    roundStart:function(){},roundEnd:function(){},getURLParam:function(){return "";},',
        '    getLanguage:function(){return (navigator.language||"en").toLowerCase().split("-")[0];},',
        '    isAdBlocked:function(){return false;},shareableURL:function(){return Promise.reject();},getSharableURL:function(){return Promise.reject();},',
        '    setPlayerAge:function(){},muteAd:function(){},requestFocus:function(){},releaseFocus:function(){},disableProgrammatic:function(){},',
        '    logError:function(){},sendHighscore:function(){},togglePlayerAdvertisingConsent:function(){},setDebugTouchOverlayController:function(){}};',
        '</scr'+'ipt>',
        '</head><body>',
        '<div id="loading-text" style="color:white;font-size:48px;font-family:cursive;text-align:center;margin-top:20px;">LOADING...</div>',
        '<div id="gameContainer"></div>',
        '<scr'+'ipt src="Build/UnityLoader.js"></scr'+'ipt>',
        '<scr'+'ipt>',
        '  var loadingText=document.querySelector("#loading-text");var partsDone=0;var totalParts=6;',
        '  async function fetchBlob(url){var a=0;while(true){try{var r=await fetch(url);if(!r.ok)throw new Error(url+" "+r.status);var b=await r.blob();partsDone++;loadingText.textContent="LOADING... "+partsDone+" / "+totalParts+" parts";return b;}catch(e){a++;if(a>=8)throw e;await new Promise(function(f){setTimeout(f,600*a);});}}}',
        '  async function mapLimit(items,limit,fn){var res=new Array(items.length);var idx=0;async function w(){while(idx<items.length){var i=idx++;res[i]=await fn(items[i]);}}var ws=[];for(var k=0;k<Math.min(limit,items.length);k++)ws.push(w());await Promise.all(ws);return res;}',
        '  async function mergeFiles(parts){var bl=await mapLimit(parts,5,fetchBlob);return URL.createObjectURL(new Blob(bl));}',
        '  function getParts(f,s,e){var p=[];for(var i=s;i<=e;i++)p.push(f+".part"+i);return p;}',
        '  (async()=>{',
        '    var dataUrl=await mergeFiles(getParts("Build/WebGL4PokiNew.data.unityweb",1,4));',
        '    var codeUrl=await mergeFiles(getParts("Build/WebGL4PokiNew.asm.code.unityweb",1,2));',
        '    var oo=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){if(typeof u==="string"){if(u.includes("WebGL4PokiNew.data.unityweb"))u=dataUrl;else if(u.includes("WebGL4PokiNew.asm.code.unityweb"))u=codeUrl;}return oo.apply(this,[m,u].concat(Array.prototype.slice.call(arguments,2)));};',
        '    window.unityGame=UnityLoader.instantiate("gameContainer","Build/WebGL4PokiNew.json",{onProgress:function(g,p){if(p>=1&&loadingText)loadingText.style.display="none";}});',
        '  })();',
        '</scr'+'ipt></body></html>'
      ].join("\n");

      var blob = new Blob([GAME_HTML], { type: "text/html" });
      document.getElementById("gameFrame").src = URL.createObjectURL(blob);
    </script>
  </body>
</html>
