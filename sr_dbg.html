<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- base href trick: all relative paths below resolve to the game's folder on jsDelivr (Cloudflare-only host) -->
    <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/snowrider/">
    <script>
      // Chromebook fix: prevent ANY browser dialog ("This page says..." dropdown) from a game/engine
      // error, and drop the Content-Type header so Unity/GameMaker analytics XHRs don't hit a CORS
      // preflight that jsDelivr rejects (which was surfacing as a repeating error dialog).
      window.alert = function(m){ try{ console.log("[alert suppressed]", m); }catch(e){} };
      window.confirm = function(){ return true; };
      window.prompt = function(){ return null; };
      (function(){
        var _sh = XMLHttpRequest.prototype.setRequestHeader;
        XMLHttpRequest.prototype.setRequestHeader = function(name, value){
          if (String(name).toLowerCase() === "content-type") return;
          return _sh.apply(this, arguments);
        };
      })();
    </script>

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Denton ISD</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* center the game + dark background (loaded after TemplateData/style.css so these win) */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #7fa8d6;
        overflow: hidden;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .webgl-content {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #gameContainer {
        width: 960px;
        height: 600px;
        max-width: 100vw;
        background: #7fa8d6;
      }
      canvas {
        background: #7fa8d6 !important;
      }
    </style>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/snowrider/Build/SnowRider3D-gd-1.json", {
        onProgress: UnityProgress,
        Module: {
          onRuntimeInitialized: function () {
            UnityProgress(gameInstance, "complete");
          },
        },
      });
    </script>
  </head>
  <body>
    <!-- corner tag: stays fixed in the top-left, rounded pill -->
    <div style="
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 16px;
      border-radius: 999px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      z-index: 9999;
      border: 1px solid rgba(80,150,255,0.6);
    ">
      Snow Rider - Made by Project: Daylight
    </div>

    <div class="webgl-content">
      <div id="gameContainer"></div>
    </div>
  </body>
</html>
