<!DOCTYPE html>
<html lang="en">
<head>
  <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host) -->
  <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/idlebreakout/">

  <!-- safety: force crossOrigin on images so cross-origin (jsDelivr) textures work with WebGL -->
  <script>
    (function(){
      try{
        var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
        Object.defineProperty(HTMLImageElement.prototype, "src", {
          configurable: true,
          get: function(){ return d.get.call(this); },
          set: function(v){ try{ if(!this.crossOrigin) this.crossOrigin = "anonymous"; }catch(e){} d.set.call(this, v); }
        });
      }catch(e){}
    })();
  </script>

  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="pragma" content="no-cache" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta charset="utf-8" />
  <title>Denton ISD</title>

  <style>
    html, body { margin:0; padding:0; border:0; width:100%; height:100%; background:#7fa8d6; }
    body { display:flex; align-items:center; justify-content:center; }
    canvas {
      image-rendering: pixelated;
      -webkit-interpolation-mode: nearest-neighbor;
      -ms-touch-action: none;
      margin:0; padding:0; border:0;
      max-width:100vw; max-height:100vh;
    }
    div.gm4html5 { margin:0; padding:0; border:0; }
    :-webkit-full-screen #canvas { width:100%; height:100%; }
    :-webkit-full-screen { width:100%; height:100%; }
  </style>
</head>

<body>
  <!-- corner tag: fixed top-left, rounded pill -->
  <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Idle Breakout - Made by P:D</div>

  <div align="center" class="gm4html5" id="gm4html5">
    <canvas id="canvas" width="1024" height="768">
      <p>Your browser doesn't support HTML5 canvas.</p>
    </canvas>
  </div>

  <!-- Run the game code -->
  <script type="text/javascript" src="html5game/Coding_BreakOut1.js"></script>
  <script>window.onload = GameMaker_Init;</script>
</body>
</html>
