<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host).
         Self-hosted in whatver/baldiremaster/ (genizy/web-port too big for jsDelivr; data/wasm re-split <20MB). -->
    <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/baldiremaster/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Denton ISD</title>
    <script>(function(){var T="Denton ISD";try{Object.defineProperty(Document.prototype,"title",{get:function(){return T;},set:function(){},configurable:true});}catch(e){setInterval(function(){if(document.title!==T)document.title=T;},500);}})();</script>
    <style>
      /* Match the original's simple canvas handling: a body-level canvas at 100%x100% that Unity
         sizes itself. (A flex container + manual resizeCanvas made Baldi create 0x0 render textures.) */
      html, body { margin:0; padding:0; border:0; height:100%; width:100%; overflow:hidden; background:#7fa8d6; }
      #unity-canvas { width:100%; height:100%; display:block; background:#7fa8d6; }
      #loading-text {
        position:fixed; top:20px; left:0; right:0; text-align:center;
        color:#fff; font-size:48px; font-family:cursive; font-weight:bold; z-index:9999; pointer-events:none;
        background: linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);
        background-size:400% 400%; -webkit-background-clip:text; background-clip:text;
        -webkit-text-fill-color:transparent; animation:rainbow 3s ease infinite;
      }
      @keyframes rainbow { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
    </style>
  </head>
  <body>
    <!-- corner tag: fixed top-left, rounded pill -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Baldi's Basics Remastered - Made by Project: Daylight</div>

    <div id="loading-text">LOADING...</div>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var loadingText = document.querySelector("#loading-text");
      var partsDone = 0;
      var totalParts = 3 + 3;

      async function fetchBlob(url) {
        var attempts = 0;
        while (true) {
          try {
            var response = await fetch(url);
            if (!response.ok) throw new Error("Fetch failed: " + url + " (" + response.status + ")");
            var b = await response.blob();
            partsDone++;
            if (loadingText) loadingText.textContent = "LOADING... " + partsDone + " / " + totalParts + " parts";
            return b;
          } catch (e) {
            attempts++;
            if (attempts >= 8) throw e;
            await new Promise(function(r){ setTimeout(r, 600 * attempts); });
          }
        }
      }
      async function mapLimit(items, limit, fn) {
        var results = new Array(items.length); var idx = 0;
        async function worker(){ while (idx < items.length){ var i = idx++; results[i] = await fn(items[i]); } }
        var ws = []; for (var k = 0; k < Math.min(limit, items.length); k++) ws.push(worker());
        await Promise.all(ws); return results;
      }
      async function mergeFiles(parts, mime) {
        var bl = await mapLimit(parts, 6, fetchBlob);
        return URL.createObjectURL(new Blob(bl, mime ? { type: mime } : undefined));
      }
      function getParts(file, count) { var p = []; for (var i = 1; i <= count; i++) p.push(file + ".part" + i); return p; }

      (async () => {
        var dataUrl = await mergeFiles(getParts("Build/WebGL.data", 3));
        var wasmUrl = await mergeFiles(getParts("Build/WebGL.wasm", 3), "application/wasm");
        // Give the canvas an explicit non-zero drawing buffer BEFORE Unity inits, so Screen.width
        // isn't 0 on the first frame (this Baldi build builds its render targets at startup).
        var cv = document.querySelector("#unity-canvas");
        cv.width = window.innerWidth || 1280;
        cv.height = window.innerHeight || 720;
        createUnityInstance(cv, {
          dataUrl: dataUrl,
          frameworkUrl: "Build/WebGL.framework.js",
          codeUrl: wasmUrl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Basically Games",
          productName: "Baldi's Basics Classic Remastered",
          productVersion: "1.1",
        }).then(function(unityInstance){
          if (loadingText) loadingText.remove();
          // Nudge Unity to rebuild render targets at the real size (fixes 0-width render textures).
          var nudges = 0;
          var t = setInterval(function(){
            window.dispatchEvent(new Event('resize'));
            if (++nudges >= 5) clearInterval(t);
          }, 700);
        }).catch(function(message){ alert(message); });
      })();
    </script>
  </body>
</html>
