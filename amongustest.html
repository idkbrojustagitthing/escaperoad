<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host) -->
    <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/amongus/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Denton ISD</title>

    <!-- PeerJS (P2P networking) vendored on the game host to avoid depending on cdnjs (may be blocked).
         Must load before the Unity loader or YapPeerTransport reports "Peer is not defined". -->
    <script src="peerjs.min.js"></script>
    <!-- HTML task minigames + overlays. common.js MUST come first (shared by the others). -->
    <link rel="stylesheet" href="tasks.css">
    <script src="common.js"></script>
    <script src="tasks.js"></script>
    <script src="meeting.js"></script>
    <script src="sabotage.js"></script>
    <script src="lobby.js"></script>
    <script src="browser.js"></script>
    <script src="kill.js"></script>
    <!-- Routes the keyboard between the game and HTML text boxes. -->
    <script src="focus.js"></script>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#7fa8d6; }
      #unity-container {
        width:100%; height:100%; background:#7fa8d6;
        display:flex; align-items:center; justify-content:center; position:relative;
      }
      #unity-canvas { display:block; background:#7fa8d6; max-width:100vw; max-height:100vh; }
      #unity-loading-bar { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:none; z-index:10; }
      #unity-footer { position:fixed; bottom:6px; right:8px; z-index:5; }
      #unity-container:fullscreen, #unity-container:-webkit-full-screen { width:100%; height:100%; background:#000; }
      #unity-container:fullscreen #unity-canvas, #unity-container:-webkit-full-screen #unity-canvas { width:100% !important; height:100% !important; }
    </style>
  </head>
  <body>
    <!-- corner tag: fixed top-left, rounded pill -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Among Us - Made by Project: Daylight</div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">MMC Among Us</div>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/amoing_us.loader.js";
      var config = {
        dataUrl: buildUrl + "/amoing_us.data.unityweb",
        frameworkUrl: buildUrl + "/amoing_us.framework.js.unityweb",
        codeUrl: buildUrl + "/amoing_us.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MMC",
        productName: "MMC Among Us",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance; // lets tasks.js SendMessage back into Unity
          loadingBar.style.display = "none";
          if (window.yapFocusGame) { window.yapFocusGame(); }
          fullscreenButton.onclick = () => {
            var request = container.requestFullscreen
                       || container.webkitRequestFullscreen
                       || container.msRequestFullscreen;
            if (request) { request.call(container); }
            else { unityInstance.SetFullscreen(1); }
          };
        }).catch((message) => { alert(message); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
