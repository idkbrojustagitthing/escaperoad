<!DOCTYPE html>

  <head>
    <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host) -->
    <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/jetpackjoyride/">

    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=no, initial-scale=1, minimum-scale=1, maximum-scale=1"/>

    <!-- Force crossOrigin on every image so Phaser's WebGL textures don't taint when loaded
         cross-origin from jsDelivr (which sends Access-Control-Allow-Origin: *). -->
    <script>
      (function(){
        var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
        Object.defineProperty(HTMLImageElement.prototype, "src", {
          set: function(v){ try { this.crossOrigin = "anonymous"; } catch(e){} d.set.call(this, v); },
          get: function(){ return d.get.call(this); },
          configurable: true
        });
      })();
    </script>

    <!-- Clean stubs: this build's ad/analytics path is disabled (implement_ads_poki gates the
         real SDK, which we don't load). Self-resolving no-ops so nothing throws. -->
    <script>
      window.PokiSDK = {
        init: function(){ return Promise.resolve(); },
        setDebug: function(){}, setLogging: function(){},
        gameLoadingStart: function(){}, gameLoadingProgress: function(){}, gameLoadingFinished: function(){},
        gameplayStart: function(){}, gameplayStop: function(){},
        commercialBreak: function(){ return Promise.resolve(); },
        rewardedBreak: function(){ return Promise.resolve(false); },
        displayAd: function(e,n,t,o){ if(o)o(true); if(t)t(); },
        destroyAd: function(){},
        happyTime: function(){}, captureError: function(){}, customEvent: function(){},
        gameInteractive: function(){}, roundStart: function(){}, roundEnd: function(){},
        getURLParam: function(){ return ""; },
        getLanguage: function(){ return (navigator.language||"en").toLowerCase().split("-")[0]; },
        isAdBlocked: function(){ return false; },
        shareableURL: function(){ return Promise.reject(); }
      };
      window.GameAnalytics = window.GameAnalytics || function(){};
      window.adsbygoogle = window.adsbygoogle || [];
      window.adConfig = window.adBreak = function(o){ /* google ads disabled */ };
    </script>
