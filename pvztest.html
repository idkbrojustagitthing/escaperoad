<!doctype html>
<html lang="en">
<head>
  <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host) -->
  <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/pvz/">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Denton ISD</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#7fa8d6; }
    body { display:flex; justify-content:center; align-items:center; }
    #canvas { display:block; outline:0; background:#7fa8d6; }
    #loading-text {
      position:fixed; top:24px; left:0; right:0; text-align:center;
      font-weight:bold; font-size:48px; font-family:cursive; color:#fff;
      background: linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);
      background-size:400% 400%; -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent; animation:rainbow 3s ease infinite; z-index:10;
    }
    @keyframes rainbow {
      0% { background-position:0% 50%; }
      50% { background-position:100% 50%; }
      100% { background-position:0% 50%; }
    }
  </style>
</head>
<body>
  <!-- corner tag: fixed top-left, rounded pill -->
  <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Plants vs Zombies - Made by Project: Daylight</div>

  <div id="loading-text">LOADING...</div>
  <canvas id="canvas" width="800" height="600"></canvas>

  <textarea
    id="pvz-soft-keyboard"
    style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0; pointer-events:none; font-size:16px"
    autocapitalize="off" autocomplete="off" autocorrect="off" enterkeyhint="done" spellcheck="false"
  ></textarea>

  <script>
    let _res, _rej;
    window.moduleReadyPromise = new Promise((r, e) => { _res = r; _rej = e; });

    var Module = {
      canvas: document.getElementById("canvas"),
      noInitialRun: true,
      onRuntimeInitialized: _res,
      onAbort: e => _rej(e),
      print: console.log,
      printErr: console.warn,
    };
  </script>

  <script>
    var loadingText = document.querySelector("#loading-text");
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        loadingText.textContent = `LOADING... ${mbDone} MB / 43.34 MB`;
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) { fullBuffer.set(chunk, offset); offset += chunk.length; }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      // Cache API only works in a secure context; fall back to a plain fetch+merge if unavailable.
      let cache = null;
      try { if (self.caches) cache = await caches.open("pvz-cache"); } catch (e) {}
      if (cache) {
        const cached = await cache.match(cacheKey);
        if (cached) return URL.createObjectURL(await cached.blob());
      }
      const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
      const mergedBlob = new Blob(buffers);
      if (cache) { try { await cache.put(cacheKey, new Response(mergedBlob)); } catch (e) {} }
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
      return parts;
    }

    (async () => {
      const [pakurl] = await Promise.all([
        mergeFiles(getParts("main.pak", 1, 3), "main.pak"),
      ]);
      let ns = document.createElement("script");
      ns.src = "pvz.js";
      document.body.appendChild(ns);
      await moduleReadyPromise;

      const files = [
        [pakurl, "main.pak"],
        ["properties/Layout.xml", "properties/Layout.xml"],
        ["properties/partner.xml.sig", "properties/partner.xml.sig"],
        ["properties/default.xml", "properties/default.xml"],
        ["properties/partner.xml", "properties/partner.xml"],
        ["properties/partner_logo.jpg", "properties/partner_logo.jpg"],
      ];

      for (const [src, dest] of files) {
        const data = new Uint8Array(await (await fetch(src)).arrayBuffer());
        const parts = dest.split("/");
        let dir = "/";
        for (let i = 0; i < parts.length - 1; i++) {
          dir += (dir === "/" ? "" : "/") + parts[i];
          try { Module.FS.mkdir(dir); } catch {}
        }
        Module.FS.writeFile("/" + dest, data);
      }

      try { Module.FS.mkdir("/saves"); } catch {}
      try { Module.FS.mount(Module.FS.filesystems.IDBFS, {}, "/saves"); } catch {}
      await new Promise(r => Module.FS.syncfs(true, r));

      const c = document.getElementById("canvas");
      const resize = () => {
        const s = Math.min(innerWidth / 800, innerHeight / 600);
        c.style.width = s * 800 + "px";
        c.style.height = s * 600 + "px";
      };
      resize();
      addEventListener("resize", resize);
      addEventListener("fullscreenchange", resize);

      const sync = () => Module.FS.syncfs(false, () => {});
      setInterval(sync, 5000);
      addEventListener("visibilitychange", () => document.hidden && sync());
      addEventListener("pagehide", sync);

      Module.callMain([]);
      loadingText.remove();
    })();
  </script>
</body>
</html>
