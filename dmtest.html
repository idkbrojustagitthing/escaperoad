<!DOCTYPE html>
<html lang="en-us">
<head>
  <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host) -->
  <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/drivemad/">

  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Denton ISD</title>
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="stylesheet" href="webapp/fancade.css">
  <link rel="icon" href="webapp/drive-mad-logo.jpg">
  <style>
    /* soft blue background behind the game */
    html, body { margin:0; padding:0; background:#7fa8d6; }
  </style>
</head>
<body id="body">
  <!-- corner tag: fixed top-left, rounded pill -->
  <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Drive Mad - Made by P:D</div>

  <div id="modal_parent">
    <div id="modal_content"><span id="modal_close_button">&times;</span>
      <div id="store_link_modal_content" class="modal_inner"></div>
      <div id="share_file_modal_content" class="modal_inner"></div>
    </div>
  </div>
  <div id="canvas_border" class="emscripten_border">
    <div id="play_content" class="middle center">
      <div class="edge">
        <div class="box">
          <div class="black"><img src="webapp/cover.jpg" class="cover">
            <p class="title">Drive Mad</p>
            <p class="author">Martin Magni</p>
          </div>
        </div>
      </div>
      <div id="progress_or_play"><progress id="progress" class="loading" value="0" max="100"></progress></div>
      <p class="description"></p>
    </div><canvas class="emscripten" id="canvas" tabindex="-1"></canvas>
    <div id="gradient"></div>
    <div id="webview_content"></div>
  </div>
  <script type="text/javascript" src="webapp/source_min.js"></script>
  <script type="text/javascript" src="webapp/index.js"></script>
</body>
</html>
