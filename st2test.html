<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host).
         SHA-pinned to web-ports/slendytubbies (immutable). Not self-hosted (~301MB). -->
    <base href="https://testingcf.jsdelivr.net/gh/web-ports/slendytubbies@efd9ef91acd1282a9ec4cae5bfd2fadc4f9f07ce/2/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Denton ISD</title>
    <style>
      html, body { margin:0; padding:0; overflow:hidden; height:100%; width:100%; background:#7fa8d6; }
      #gameContainer {
        width:100vw !important; height:100vh !important;
        display:flex; align-items:center; justify-content:center; background:#7fa8d6;
      }
      #gameContainer canvas { background:#7fa8d6; }
      #loading-text {
        position:fixed; top:20px; left:0; right:0; text-align:center;
        color:#fff; font-size:48px; font-family:cursive; font-weight:bold; z-index:9999; pointer-events:none;
        background: linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);
        background-size:400% 400%; -webkit-background-clip:text; background-clip:text;
        -webkit-text-fill-color:transparent; animation:rainbow 3s ease infinite;
      }
      @keyframes rainbow { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
    </style>
  </head>
  <body>
    <!-- corner tag: fixed top-left, rounded pill -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Slendytubbies 2 - Made by Project: Daylight</div>

    <div id="loading-text"
      style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">LOADING...</div>
    <div id="gameContainer"></div>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var loadingText = document.querySelector("#loading-text");
      let loadedBytes = 0;

      async function fetchWithProgress(url) {
        const response = await fetch(url);
        const reader = response.body.getReader();
        let chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          loadedBytes += value.length;
          chunks.push(value);
          let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
          loadingText.textContent = `LOADING... ${mbDone} MB / 298.61 MB`;
        }
        let fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (let chunk of chunks) { fullBuffer.set(chunk, offset); offset += chunk.length; }
        return fullBuffer.buffer;
      }

      async function mergeFiles(fileParts, cacheKey) {
        let cache = null;
        try { if (self.caches) cache = await caches.open("sl2-cache"); } catch (e) {}
        if (cache) {
          const cached = await cache.match(cacheKey);
          if (cached) return URL.createObjectURL(await cached.blob());
        }
        const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
        const mergedBlob = new Blob(buffers);
        if (cache) { try { await cache.put(cacheKey, new Response(mergedBlob)); } catch (e) {} }
        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
        return parts;
      }

      (async () => {
        const [dataUrl, wasmUrl] = await Promise.all([
          mergeFiles(getParts("Build/Build.data.unityweb", 1, 14), "Build.data.unityweb"),
          mergeFiles(getParts("Build/Build.asm.code.unityweb", 1, 2), "Build.asm.code.unityweb"),
        ]);
        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          if (typeof url === "string") {
            if (url.includes("Build.asm.code.unityweb")) { url = wasmUrl; }
            else if (url.includes("Build.data.unityweb")) { url = dataUrl; }
          }
          return originalOpen.call(this, method, url, ...rest);
        };
        var unityInstance = UnityLoader.instantiate("gameContainer", "Build/Build.json");
        loadingText.style.display = "none";
      })();
    </script>
  </body>
</html>
