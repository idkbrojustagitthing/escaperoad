<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host) -->
    <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/retrobowl/">

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="pragma" content="no-cache"/>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8"/>
    <title>Denton ISD</title>

    <!-- Drop the Content-Type header GameMaker sets on its .txt/.dat XHR loads: it forces a CORS
         preflight that jsDelivr rejects (data fails to load). Without it the GET is a "simple" request. -->
    <script>
      (function(){
        var _setHeader = XMLHttpRequest.prototype.setRequestHeader;
        XMLHttpRequest.prototype.setRequestHeader = function(name, value){
          if (String(name).toLowerCase() === "content-type") return;
          return _setHeader.apply(this, arguments);
        };
      })();
    </script>

    <!-- Clean PokiSDK stub: self-resolving no-ops so the game starts without ads/tracking -->
    <script>
      window.PokiSDK = {
        init: function(){ return Promise.resolve(); },
        initWithVideoHB: function(){ return Promise.resolve(); },
        setDebug: function(){}, setLogging: function(){},
        gameLoadingStart: function(){}, gameLoadingProgress: function(){}, gameLoadingFinished: function(){},
        gameplayStart: function(){}, gameplayStop: function(){},
        commercialBreak: function(){ return Promise.resolve(); },
        rewardedBreak: function(){ return Promise.resolve(false); },
        displayAd: function(e,n,t,o){ if(o)o(true); if(t)t(); },
        destroyAd: function(){},
        getLeaderboard: function(){ return Promise.resolve(); },
        shareableURL: function(){ return Promise.reject(); },
        getURLParam: function(){ return ""; },
        getLanguage: function(){ return (navigator.language||"en").toLowerCase().split("-")[0]; },
        isAdBlocked: function(){ return false; },
        captureError: function(){}, customEvent: function(){}, gameInteractive: function(){},
        happyTime: function(){}, logError: function(){}, muteAd: function(){}, roundEnd: function(){},
        roundStart: function(){}, sendHighscore: function(){}, setPlayerAge: function(){},
        setPlaytestCanvas: function(){}, enableEventTracking: function(){},
        setDebugTouchOverlayController: function(){}
      };
    </script>

    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#7fa8d6; }
      body { display:flex; align-items:center; justify-content:center; }
      #gm4html5_div_id { display:flex; align-items:center; justify-content:center; }
      canvas {
        image-rendering: optimizeSpeed;
        -webkit-interpolation-mode: nearest-neighbor;
        -ms-touch-action: none;
        margin:0; padding:0; border:0;
        max-width:100vw; max-height:100vh;
      }
      :-webkit-full-screen #canvas { width:100%; height:100%; }
      div.gm4html5_div_class { margin:0; padding:0; border:0; }
    </style>
  </head>

  <body>
    <!-- corner tag: fixed top-left, rounded pill -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Retro Bowl - Made by Project: Daylight</div>

    <div class="gm4html5_div_class" id="gm4html5_div_id">
      <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="GameMaker:HTML5 loading screen" style="display:none;"/>
      <canvas id="canvas" width="853" height="480">
        <p>Your browser doesn't support HTML5 canvas.</p>
      </canvas>
    </div>

    <script type="text/javascript" src="html5game/RetroBowl.js"></script>

    <!-- clean start (no ads, no sitelock, no spam-tab): just init the game -->
    <script>
      window.addEventListener("load", function(){
        window.PokiSDK_loadState = 0;
        window.PokiSDK_OK = true;
        if (window.PokiSDK && window.PokiSDK.init) {
          window.PokiSDK.init().then(function(){ GameMaker_Init(); }).catch(function(){ GameMaker_Init(); });
        } else {
          GameMaker_Init();
        }
      });
    </script>
  </body>
</html>
