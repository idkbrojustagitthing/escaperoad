<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host) -->
    <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/spaceflightsim/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Denton ISD</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#7fa8d6; }
      #unity-container {
        width:100%; height:100%; background:#7fa8d6;
        display:flex; align-items:center; justify-content:center; position:relative;
      }
      #unity-canvas { display:block; background:#7fa8d6; max-width:100vw; max-height:100vh; }
      #unity-loading-bar { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:none; z-index:10; }
      #unity-warning { position:absolute; left:50%; top:5%; transform:translateX(-50%); z-index:20; }
      #loading-text {
        position:fixed; top:24px; left:0; right:0; text-align:center;
        color:#fff; font-size:48px; font-family:cursive; font-weight:bold; z-index:30;
      }
    </style>
  </head>
  <body>
    <!-- corner tag: fixed top-left, rounded pill -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Spaceflight Simulator - Made by Project: Daylight</div>

    <div id="loading-text">LOADING...</div>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var loadingText = document.querySelector("#loading-text");
      let loadedBytes = 0;

      async function fetchWithProgress(url) {
        const response = await fetch(url);
        const reader = response.body.getReader();
        let chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          loadedBytes += value.length;
          chunks.push(value);
          let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
          loadingText.textContent = `LOADING... ${mbDone} MB / 87.82 MB`;
        }
        let fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (let chunk of chunks) { fullBuffer.set(chunk, offset); offset += chunk.length; }
        return fullBuffer.buffer;
      }

      async function mergeFiles(fileParts, cacheKey, mime) {
        // Cache API only works in a secure context; fall back to a plain fetch+merge if unavailable.
        let cache = null;
        try { if (self.caches) cache = await caches.open("gash-cache"); } catch (e) {}
        const blobOpts = mime ? { type: mime } : undefined;
        if (cache) {
          const cached = await cache.match(cacheKey);
          if (cached) {
            const b = await cached.blob();
            // ensure the right MIME (e.g. application/wasm for streaming compile)
            return URL.createObjectURL(mime ? new Blob([b], blobOpts) : b);
          }
        }
        const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
        const mergedBlob = new Blob(buffers, blobOpts);
        if (cache) { try { await cache.put(cacheKey, new Response(mergedBlob)); } catch (e) {} }
        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
        return parts;
      }

      (async () => {
        const [dataUrl, wasmUrl] = await Promise.all([
          mergeFiles(getParts("Build/sfsim.data", 1, 3), "sfsim.data"),
          mergeFiles(getParts("Build/sfsim.wasm", 1, 3), "sfsim.wasm", "application/wasm"),
        ]);
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {}

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/sfsim.loader.js";
        var config = {
          arguments: [],
          dataUrl: dataUrl,
          frameworkUrl: buildUrl + "/sfsim.framework.js",
          codeUrl: wasmUrl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Stef Morojna",
          productName: "Spaceflight Simulator",
          productVersion: "1.6.00.16",
          showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          document.getElementsByTagName('head')[0].appendChild(meta);
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            if (loadingText) loadingText.remove();
          }).catch((message) => {
            alert(message);
          });
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
