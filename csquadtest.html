<!DOCTYPE html>
<html lang="en">

<head>
	<!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host).
	     SHA-pinned to web-ports/cruelty-squad (immutable). Not self-hosted (~560MB Godot build). -->
	<base href="https://testingcf.jsdelivr.net/gh/web-ports/cruelty-squad@19362b389fecb3c75593584d26f8d6c051430124/">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>Denton ISD</title>
	<!-- Lock the tab title so Godot can't rename it away from Denton ISD. -->
	<script>
		(function(){
			var TITLE = "Denton ISD";
			try {
				Object.defineProperty(Document.prototype, "title", {
					get: function(){ return TITLE; },
					set: function(){},
					configurable: true
				});
			} catch(e){ setInterval(function(){ if (document.title !== TITLE) document.title = TITLE; }, 500); }
		})();
	</script>
	<style>
		html,
		body,
		#canvas {
			margin: 0;
			padding: 0;
			border: 0;
		}

		body {
			color: white;
			background-color: #7fa8d6;
			overflow: hidden;
			touch-action: none;
		}

		#canvas {
			display: block;
		}

		#canvas:focus {
			outline: none;
		}

		#status,
		#status-splash,
		#status-progress {
			position: absolute;
			left: 0;
			right: 0;
		}

		#status,
		#status-splash {
			top: 0;
			bottom: 0;
		}

		#status {
			background-color: #000000;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			visibility: hidden;
		}

		#status-splash {
			max-height: 100%;
			max-width: 100%;
			margin: auto;
		}

		#status-splash.show-image--false {
			display: none;
		}

		#status-splash.fullsize--true {
			height: 100%;
			width: 100%;
			object-fit: contain;
		}

		#status-splash.use-filter--false {
			image-rendering: pixelated;
		}

		#status-progress,
		#status-notice {
			display: none;
		}

		#status-progress {
			bottom: 10%;
			width: 50%;
			margin: 0 auto;
		}

		#status-notice {
			background-color: #5b3943;
			border-radius: 0.5rem;
			border: 1px solid #9b3943;
			color: #e0e0e0;
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			line-height: 1.3;
			margin: 0 2rem;
			overflow: hidden;
			padding: 1rem;
			text-align: center;
			z-index: 1;
		}
#loading-text {
  font-weight: bold;
  background: linear-gradient(
    270deg,
    #ff0000,

    #ffff00,
    #00ff00,

  );
  background-size: 400% 400%;

  -webkit-text-fill-color: transparent;

}

@keyframes rainbow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

<body>
	<!-- corner tag: fixed top-left, rounded pill -->
	<div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Cruelty Squad - Made by Project: Daylight</div>
	<div id="loading-text" style="color: white; font-family: cursive; font-size: 48px; text-align: center; margin-top: 20px;">LOADING...</div>
	<canvas id='canvas'>
		HTML5 canvas appears to be unsupported in the current browser.<br />
		Please try updating or use a different browser.
	</canvas>
	<div id='status'>
		<div id='status-progress' style='display: none;' oncontextmenu='event.preventDefault();'><div id ='status-progress-inner'></div></div>
		<div id='status-indeterminate' style='display: none;' oncontextmenu='event.preventDefault();'>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
		</div>
		<div id='status-notice' class='godot' style='display: none;'></div>
	</div>
	<script src="index.js"></script>
	<script>
		window.godotRunStart = function() {
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":540769488,"index.wasm":17860295},"focusCanvas":true,"gdnativeLibs":[]};
		var engine = new Engine(GODOT_CONFIG);

		(function() {
			const INDETERMINATE_STATUS_STEP_MS = 100;
			var statusProgress = document.getElementById('status-progress');
			var statusProgressInner = document.getElementById('status-progress-inner');
			var statusIndeterminate = document.getElementById('status-indeterminate');
			var statusNotice = document.getElementById('status-notice');

			var initializing = true;
			var statusMode = 'hidden';

			var animationCallbacks = [];
			function animate(time) {
				animationCallbacks.forEach(callback => callback(time));
				requestAnimationFrame(animate);
			}
			requestAnimationFrame(animate);

			function setStatusMode(mode) {

				if (statusMode === mode || !initializing)
					return;
				[statusProgress, statusIndeterminate, statusNotice].forEach(elem => {
					elem.style.display = 'none';
				});
				animationCallbacks = animationCallbacks.filter(function(value) {
					return (value != animateStatusIndeterminate);
				});
				switch (mode) {
					case 'progress':
						statusProgress.style.display = 'block';
						break;
					case 'indeterminate':
						statusIndeterminate.style.display = 'block';
						animationCallbacks.push(animateStatusIndeterminate);
						break;
					case 'notice':
						statusNotice.style.display = 'block';
						break;
					case 'hidden':
						break;
					default:
						throw new Error('Invalid status mode');
				}
				statusMode = mode;
			}

			function animateStatusIndeterminate(ms) {
				var i = Math.floor(ms / INDETERMINATE_STATUS_STEP_MS % 8);
				if (statusIndeterminate.children[i].style.borderTopColor == '') {
					Array.prototype.slice.call(statusIndeterminate.children).forEach(child => {
						child.style.borderTopColor = '';
					});
					statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
				}
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) {
					statusNotice.removeChild(statusNotice.lastChild);
				}
				var lines = text.split('\n');
				lines.forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			};

			function displayFailureNotice(err) {
				var msg = err.message || err;
				console.error(msg);
				setStatusNotice(msg);
				setStatusMode('notice');
				initializing = false;
			};

			if (!Engine.isWebGLAvailable()) {
				displayFailureNotice('WebGL not available');
			} else {
				setStatusMode('indeterminate');
				engine.startGame({
					'onProgress': function (current, total) {
						if (total > 0) {
							statusProgressInner.style.width = current/total * 100 + '%';
							setStatusMode('progress');
							if (current === total) {
								// wait for progress bar animation
								setTimeout(() => {
									setStatusMode('indeterminate');
								}, 500);
							}
						} else {
							setStatusMode('indeterminate');
						}
					},
				}).then(() => {
					setStatusMode('hidden');
					initializing = false;
				}, displayFailureNotice);
			}
		})();
	};
	</script>
	<!-- Hardened replacement for the upstream main.js: merges the 28 index.pck parts as DISK-BACKED
	     blobs (composed by reference so ~516MB never all sits in RAM -> safe on low-memory Chromebooks),
	     rejects error responses (a 404 can never be cached as game data), and self-heals a bad cache. -->
	<script>
		(function(){
			var loadingText = document.querySelector("#loading-text");
			var originalFetch = window.fetch;
			var partsDone = 0;
			var totalParts = 28;

			// Retry transient failures (jsDelivr rate-limits bursts of parallel requests with 403/429).
			async function fetchBlob(url) {
				var attempts = 0;
				while (true) {
					try {
						var response = await originalFetch(url);
						if (!response.ok) throw new Error("Fetch failed: " + url + " (" + response.status + ")");
						var b = await response.blob();
						partsDone++;
						loadingText.textContent = "LOADING... " + partsDone + " / " + totalParts + " parts";
						return b;
					} catch (e) {
						attempts++;
						if (attempts >= 8) throw e;
						await new Promise(function(r){ setTimeout(r, 600 * attempts); }); // backoff
					}
				}
			}

			// Limit concurrency to avoid tripping jsDelivr/Cloudflare rate limits on 28 parallel fetches.
			async function mapLimit(items, limit, fn) {
				var results = new Array(items.length);
				var idx = 0;
				async function worker() {
					while (idx < items.length) {
						var i = idx++;
						results[i] = await fn(items[i]);
					}
				}
				var workers = [];
				for (var w = 0; w < Math.min(limit, items.length); w++) workers.push(worker());
				await Promise.all(workers);
				return results;
			}

			async function mergeFiles(fileParts, cacheKey, minBytes) {
				var cache = null;
				try { if (self.caches) cache = await caches.open("cruelty-squad-cache-v1"); } catch (e) {}
				if (cache) {
					var cached = await cache.match(cacheKey);
					if (cached) {
						var cb = await cached.blob();
						if (!minBytes || cb.size >= minBytes) return URL.createObjectURL(cb);
						try { await cache.delete(cacheKey); } catch (e) {}
					}
				}
				var blobs = await mapLimit(fileParts, 6, fetchBlob);
				var merged = new Blob(blobs);
				if (cache && (!minBytes || merged.size >= minBytes)) {
					try { await cache.put(cacheKey, new Response(merged)); } catch (e) {}
				}
				return URL.createObjectURL(merged);
			}

			function getParts(file, start, end) {
				var parts = [];
				for (var i = start; i <= end; i++) parts.push(file + ".part" + i);
				return parts;
			}

			(async function(){
				var pckUrl = await mergeFiles(getParts("index.pck", 1, 28), "index.pck", 500 * 1024 * 1024);
				window.fetch = function(url) {
					var rest = Array.prototype.slice.call(arguments, 1);
					if (typeof url === "string" && url.endsWith("index.pck")) {
						return originalFetch.apply(this, [pckUrl].concat(rest));
					}
					return originalFetch.apply(this, arguments);
				};
				if (loadingText) loadingText.remove();
				window.godotRunStart();
			})();
		})();
	</script>
</body>
