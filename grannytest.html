<!DOCTYPE html>
<html lang="en-us">
<head>
  <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host).
       Pinned to web-ports/granny commit SHA so it stays stable even if upstream main moves.
       Not self-hosted in whatver because the build is ~570MB (29 x ~20MB data parts). -->
  <base href="https://testingcf.jsdelivr.net/gh/web-ports/granny@60c96c26856a76aac5e8aa15fc7310bf0fc01b4e/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Denton ISD</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden; height: 100%; width: 100%;
      background: #7fa8d6;
    }
    #unityContainer {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #7fa8d6;
    }
    #unityContainer canvas { background: #7fa8d6; }

    #loading-text {
      position: fixed; top: 24px; left: 0; right: 0; text-align: center;
      font-weight: bold; font-size: 48px; font-family: cursive; color: #fff; z-index: 10;
      background: linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);
      background-size: 400% 400%; -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; animation: rainbow 3s ease infinite;
    }
    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>

  <div id="loading-text"
    style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">LOADING...</div>

  <script>
    var loadingText = document.querySelector("#loading-text");
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        loadingText.textContent = `LOADING... ${mbDone} MB / 567.86 MB`;
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) { fullBuffer.set(chunk, offset); offset += chunk.length; }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts) {
      const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
      const mergedBlob = new Blob(buffers);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
      return parts;
    }

    (async () => {
      const [dataUrl] = await Promise.all([
        mergeFiles(getParts("Build/GrannyPortButBetter.data.unityweb", 1, 29))
      ]);
      // Old UnityLoader fetches the .data via XHR; redirect that one request to the merged blob.
      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url, ...rest) {
        if (typeof url === "string" && url.includes("GrannyPortButBetter.data.unityweb")) {
          url = dataUrl;
        }
        return originalOpen.call(this, method, url, ...rest);
      };
      var unityInstance = UnityLoader.instantiate(
        "unityContainer",
        "Build/GrannyPortButBetter.json",
        { onProgress: UnityProgress }
      );
      loadingText.remove();
    })();
  </script>
</head>

<body>
  <!-- corner tag: fixed top-left, rounded pill -->
  <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Granny - Made by Project: Daylight</div>

  <div id="unityContainer"></div>
</body>
</html>
