<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host).
         SHA-pinned to web-ports/duck-8 (immutable). Not self-hosted (~179MB). -->
    <base href="https://testingcf.jsdelivr.net/gh/web-ports/duck-8@e383317e834db183a3893b0303b4d7d9be2a473b/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Denton ISD</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; background:#7fa8d6; }
      #unity-container {
        width:100%; height:100%; position:fixed; top:0; left:0; background:#7fa8d6;
        display:flex; align-items:center; justify-content:center;
      }
      #unity-container canvas { background:#7fa8d6; max-width:100vw; max-height:100vh; }
      #loading-text {
        position:fixed; top:20px; left:0; right:0; text-align:center;
        color:#fff; font-size:48px; font-family:cursive; font-weight:bold; z-index:9999; pointer-events:none;
        background: linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);
        background-size:400% 400%; -webkit-background-clip:text; background-clip:text;
        -webkit-text-fill-color:transparent; animation:rainbow 3s ease infinite;
      }
      @keyframes rainbow { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
    </style>
  </head>
  <body>
    <!-- corner tag: fixed top-left, rounded pill -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Duck Life 8 - Made by Project: Daylight</div>

    <script src="Build/UnityLoader.js"></script>
    <div id="loading-text"
      style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">LOADING...</div>
    <div id="unity-container"></div>
    <script>
      var loadingText = document.querySelector("#loading-text");
      let loadedBytes = 0;

      async function fetchWithProgress(url) {
        const response = await fetch(url);
        // Never read an error body as data (a 404 would otherwise merge into the build and break it).
        if (!response.ok) throw new Error("Fetch failed: " + url + " (" + response.status + ")");
        const reader = response.body.getReader();
        let chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          loadedBytes += value.length;
          chunks.push(value);
          let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
          loadingText.textContent = `LOADING... ${mbDone} MB / 178.06 MB`;
        }
        let fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (let chunk of chunks) { fullBuffer.set(chunk, offset); offset += chunk.length; }
        return fullBuffer.buffer;
      }

      async function mergeFiles(fileParts, cacheKey) {
        const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
        return URL.createObjectURL(new Blob(buffers));
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
        return parts;
      }

      (async () => {
        const [dataUrl, wasmUrl] = await Promise.all([
          mergeFiles(getParts("Build/dl8.data.unityweb", 1, 8), "dl8.data.unityweb"),
          mergeFiles(getParts("Build/dl8.wasm.code.unityweb", 1, 2), "dl8.wasm.code.unityweb"),
        ]);
        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          if (typeof url === "string") {
            if (url.includes("dl8.data.unityweb")) { url = dataUrl; }
            else if (url.includes("dl8.wasm.code.unityweb")) { url = wasmUrl; }
          }
          return originalOpen.call(this, method, url, ...rest);
        };
        UnityLoader.instantiate("unity-container", "Build/dl8.json");
        loadingText.style.display = "none";
      })();
    </script>
  </body>
</html>
