<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host) -->
    <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/baldi/">

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Denton ISD</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- Reassemble the >20MB Unity data from sub-20MB jsDelivr chunks. Old UnityLoader.js downloads
         .unityweb via XMLHttpRequest, so intercept XHR for the data file and synthesize the response. -->
    <script>
      (function(){
        var PARTS = ["Build/parts/baldidata.part0", "Build/parts/baldidata.part1"];
        var proto = XMLHttpRequest.prototype;
        var _open = proto.open, _send = proto.send;
        proto.open = function(method, url){
          this.__reassemble = (typeof url === "string" && url.indexOf(".data.unityweb") !== -1);
          return _open.apply(this, arguments);
        };
        proto.send = function(body){
          var xhr = this;
          if(!xhr.__reassemble) return _send.apply(this, arguments);
          Promise.all(PARTS.map(function(p){
            return fetch(new URL(p, document.baseURI).href).then(function(r){ if(!r.ok) throw new Error(p+" "+r.status); return r.arrayBuffer(); });
          })).then(function(bufs){
            var total = bufs.reduce(function(a,b){return a+b.byteLength;},0);
            var merged = new Uint8Array(total), off=0;
            bufs.forEach(function(b){ merged.set(new Uint8Array(b), off); off += b.byteLength; });
            var buf = merged.buffer;
            Object.defineProperty(xhr, "response",     { configurable:true, get:function(){ return buf; } });
            Object.defineProperty(xhr, "responseType", { configurable:true, get:function(){ return "arraybuffer"; }, set:function(){} });
            Object.defineProperty(xhr, "status",       { configurable:true, get:function(){ return 200; } });
            Object.defineProperty(xhr, "readyState",   { configurable:true, get:function(){ return 4; } });
            try{ if(xhr.onprogress) xhr.onprogress({lengthComputable:true, loaded:total, total:total}); }catch(e){}
            try{ if(xhr.onreadystatechange) xhr.onreadystatechange(); }catch(e){}
            try{ if(xhr.onload) xhr.onload(); }catch(e){}
            try{ xhr.dispatchEvent(new Event("load")); }catch(e){}
          }).catch(function(err){
            try{ if(xhr.onerror) xhr.onerror(err); }catch(e){}
          });
        };
      })();
    </script>

    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#7fa8d6; }
      body { display:flex; align-items:center; justify-content:center; }
      .webgl-content { display:flex; align-items:center; justify-content:center; }
      #unityContainer { max-width:100vw; max-height:100vh; background:#7fa8d6; }
      canvas { background:#7fa8d6 !important; }
    </style>

    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var unityInstance = UnityLoader.instantiate("unityContainer", "https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/baldi/Build/baldi webgl.json", {
        onProgress: UnityProgress,
        Module: {
          onRuntimeInitialized: function () { UnityProgress(unityInstance, "complete"); },
        },
      });
    </script>
  </head>
  <body>
    <!-- corner tag: fixed top-left, rounded pill -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Baldi's Basics - Made by P:D</div>

    <div class="webgl-content">
      <div id="unityContainer"></div>
    </div>

    <!-- scale Baldi's tiny fixed-resolution canvas up to fill the screen (keeps aspect + crisp pixels) -->
    <script>
      (function(){
        function fitCanvas(){
          var c = document.querySelector("#unityContainer canvas") || document.querySelector("canvas");
          if(!c) return;
          var cw = c.width || parseInt(c.getAttribute("width")) || c.clientWidth;
          var ch = c.height || parseInt(c.getAttribute("height")) || c.clientHeight;
          if(!cw || !ch) return;
          var scale = Math.min(window.innerWidth / cw, window.innerHeight / ch) * 0.98;
          // scale via CSS width/height (NOT transform) so Unity's mouse-coordinate mapping and the
          // clickable area stay aligned — transform:scale breaks clicking the buttons.
          c.style.transform = "none";
          c.style.width = Math.round(cw * scale) + "px";
          c.style.height = Math.round(ch * scale) + "px";
          c.style.imageRendering = "pixelated";
        }
        window.addEventListener("resize", fitCanvas);
        setInterval(fitCanvas, 400);
      })();
    </script>
  </body>
</html>
