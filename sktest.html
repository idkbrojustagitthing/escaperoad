<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host) -->
    <base href="https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/stickman/">

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Denton ISD</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>

    <style type="text/css">
      html, body { overflow: hidden; margin:0; padding:0; width:100%; height:100%; background:#7fa8d6; }
      body { display:flex; align-items:center; justify-content:center; }
      canvas { background:#7fa8d6 !important; }
    </style>

    <!-- FreezeNova ad hooks kept as guarded no-ops (the Unity build calls these via jslib); the ad
         network loader (wgplayer.com) + analytics are removed so the game runs clean and ad-free. -->
    <script>
      function SubmitLeaderboardScore(newScore) {}
      function GetLeaderboardEntries() {}

      function InitApi(_appId) {
        var dateNow = new Date();
        var secondsSinceEpoch = Math.round(dateNow.getTime() / 1000);
        window.callTime = secondsSinceEpoch - 181;
      }
      function InitExternEval(_appId) { ExternEval(); }
      function ExternEval() {
        if (typeof preroll !== 'undefined' && window[preroll.config.loaderObjectName] != undefined) {
          try { gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose'); } catch(e) {}
        }
      }
      function ExternEvalResumeGame() { try { gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose'); } catch(e) {} }
      function PreloadRewarded() {}
      function ShowRewarded() {
        try { gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose'); } catch(e) {}
      }
      function RewardedReady() {}
      function RewardedSuccess() { try { gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose'); } catch(e) {} }
      function RewardedFail() { try { gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose'); } catch(e) {} }
      function RewardedClose() { try { gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose'); } catch(e) {} }

      InitApi(0);
    </script>

    <script>
      function FitScreen() {
        var w = window.innerWidth, h = window.innerHeight;
        var availWidth = window.innerWidth, availHeight = window.innerHeight;
        var width, height;
        if (availWidth / availHeight > w / h) { height = availHeight; width = (height * w / h); }
        else { width = availWidth; height = width * h / w; }
        var gc = document.getElementById("gameContainer");
        if (gc) { gc.style.width = width + "px"; gc.style.height = height + "px"; }
      }

      var gameInstance = UnityLoader.instantiate("gameContainer", "https://testingcf.jsdelivr.net/gh/idkbrojustagitthing/whatver@main/stickman/Build/game.json", {
        onProgress: UnityProgress,
        Module: {
          onRuntimeInitialized: function () { UnityProgress(gameInstance, "complete"); },
        },
      });
    </script>
  </head>
  <body onfocus="FitScreen();" onload="FitScreen();" onresize="FitScreen();">
    <!-- corner tag: fixed top-left, rounded pill -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Stickman Destruction - Made by P:D</div>

    <div class="webgl-content">
      <div id="gameContainer" style="width: auto; height: auto"></div>
    </div>
  </body>
</html>
