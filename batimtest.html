<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <!-- base href trick: relative paths resolve to the (original author's) BATIM repo on jsDelivr, Cloudflare-only host -->
  <base href="https://testingcf.jsdelivr.net/gh/woahhcrackers/BATIMWeb@main/">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Denton ISD</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html, body { margin:0; padding:0; background:#7fa8d6; }
  </style>
</head>

<body>
  <!-- corner tag: fixed top-left, rounded pill -->
  <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Bendy - Made by P:D</div>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-full"></div>
    </div>
    <div id="unity-warning"> </div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Bendy and the Ink Machine</div>
    </div>
  </div>

  <!-- chunk-reassembly config + merger (from the game's own repo): rebuilds bend.data (29 parts) and bend.wasm (2 parts) -->
  <script>
    window.fileMergerConfig = {
      files: [
        { name: 'bend.data', parts: 29 },
        { name: 'bend.wasm', parts: 2 },
      ],
      basePath: 'Build/',
      debug: false
    };
  </script>
  <script src="merge.js"></script>

  <script>
    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function() { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/bend.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/bend.data",
      frameworkUrl: buildUrl + "/bend.framework.js",
      codeUrl: buildUrl + "/bend.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "crackers",
      productName: "Bendy and the Ink Machine",
      productVersion: "0.0.2",
      showBanner: unityShowBanner,
      // don't try to store the ~550MB build in IndexedDB (quota/timeout) — download+use directly
      cacheControl: function (url) { return "no-store"; },
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
      config.devicePixelRatio = 1;
    } else {
      canvas.style.width = "105vw";
      canvas.style.height = "105vh";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
        document.querySelector("#unity-fullscreen-button").onclick = () => { unityInstance.SetFullscreen(1); };
      }).catch((message) => { alert(message); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
