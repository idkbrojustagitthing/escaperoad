<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host).
         SHA-pinned to web-ports/jsab (immutable). Not self-hosted in whatver because the build is
         ~374MB (Build parts + ~283MB of on-demand Addressables level bundles in StreamingAssets). -->
    <base href="https://testingcf.jsdelivr.net/gh/web-ports/jsab@372b6ad58c88f69f1faaa9223c5993ae488c1032/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Denton ISD</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <style>
      html, body {
        margin: 0; padding: 0; overflow: hidden; height: 100%; width: 100%;
        background: #7fa8d6;
        cursor: url('Cursor.png'), auto;
      }
      #unityContainer {
        width: 100vw !important; height: 100vh !important;
        display: flex; align-items: center; justify-content: center;
        background: #7fa8d6;
      }
      #unityContainer canvas { background: #7fa8d6; }

      #loading-text {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        z-index: 999999; font-size: 48px; font-family: cursive; font-weight: bold;
        pointer-events: none; color: #fff;
        background: linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);
        background-size: 400% 400%; -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; animation: rainbow 3s ease infinite;
      }
      @keyframes rainbow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    </style>
  </head>
  <body>
    <!-- corner tag: fixed top-left, rounded pill -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Just Shapes &amp; Beats - Made by Project: Daylight</div>

    <div id="loading-text"
      style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">LOADING...</div>
    <div class="webgl-content">
      <div id="unityContainer"></div>
    </div>
    <script>
      var loadingText = document.querySelector("#loading-text");
      let loadedBytes = 0;

      async function fetchWithProgress(url) {
        const response = await fetch(url);
        const reader = response.body.getReader();
        let chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          loadedBytes += value.length;
          chunks.push(value);
          let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
          loadingText.textContent = `LOADING... ${mbDone} MB / 132.83 MB`;
        }
        let fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (let chunk of chunks) { fullBuffer.set(chunk, offset); offset += chunk.length; }
        return fullBuffer.buffer;
      }

      async function mergeFiles(fileParts, cacheKey) {
        // Cache API only works in a secure context; fall back to a plain fetch+merge if unavailable.
        let cache = null;
        try { if (self.caches) cache = await caches.open("jsab-cache"); } catch (e) {}
        if (cache) {
          const cached = await cache.match(cacheKey);
          if (cached) return URL.createObjectURL(await cached.blob());
        }
        const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
        const mergedBlob = new Blob(buffers);
        if (cache) { try { await cache.put(cacheKey, new Response(mergedBlob)); } catch (e) {} }
        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
        return parts;
      }

      (async () => {
        const [dataUrl, wasmUrl, bundle] = await Promise.all([
          mergeFiles(getParts("Build/jsab.data.unityweb", 1, 4), "jsab.data.unityweb"),
          mergeFiles(getParts("Build/jsab.wasm.code.unityweb", 1, 2), "jsab.wasm.code.unityweb"),
          mergeFiles(getParts("StreamingAssets/aa/WebGL/fonts_tmp_assets_all_c2712a523e390d12249a703a5257c93b.bundle", 1, 3), "fonts_tmp_assets_all_c2712a523e390d12249a703a5257c93b.bundle"),
        ]);
        // Old UnityLoader fetches data/wasm/bundles via XHR; redirect the merged ones to their blob URLs,
        // and show the loading label while any other on-demand level .bundle streams in.
        const originalOpen = XMLHttpRequest.prototype.open;
        const originalSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          this._requestUrl = url;
          if (typeof url === "string") {
            if (url.includes("jsab.data.unityweb")) {
              url = dataUrl;
            } else if (url.includes("jsab.wasm.code.unityweb")) {
              url = wasmUrl;
            } else if (url.includes("fonts_tmp_assets_all_c2712a523e390d12249a703a5257c93b.bundle")) {
              url = bundle;
            } else if (url.includes(".bundle")) {
              loadingText.style.display = "block";
              loadingText.textContent = url.split("/").pop().replace(".bundle", "");
            }
          }
          this._modifiedUrl = url;
          return originalOpen.call(this, method, url, ...rest);
        };
        XMLHttpRequest.prototype.send = function (...args) {
          if (this._requestUrl && this._requestUrl.includes(".bundle")) {
            this.addEventListener("loadend", () => { loadingText.style.display = "none"; });
          }
          return originalSend.apply(this, args);
        };
        var unityInstance = UnityLoader.instantiate("unityContainer", "Build/jsab.json", { onProgress: UnityProgress });
        loadingText.style.display = "none";
      })();
    </script>
  </body>
</html>
