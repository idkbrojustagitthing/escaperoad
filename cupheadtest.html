<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host).
         SHA-pinned to web-ports/cuphead (immutable). Not self-hosted (~2.1GB). -->
    <base href="https://testingcf.jsdelivr.net/gh/web-ports/cuphead@c9ff1b6b16f9d402b78a42fc2200e1c076c0ab6e/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Denton ISD</title>
    <style>
      html, body { margin:0; padding:0; overflow:hidden; height:100%; width:100%; background:#7fa8d6; }
      #gameContainer {
        width:100vw !important; height:100vh !important;
        display:flex; align-items:center; justify-content:center; background:#7fa8d6;
      }
      #gameContainer canvas { background:#7fa8d6; }
      #loading-text {
        position:fixed; top:20px; left:0; right:0; text-align:center;
        color:#fff; font-size:48px; font-family:cursive; font-weight:bold; z-index:9999; pointer-events:none;
        background: linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);
        background-size:400% 400%; -webkit-background-clip:text; background-clip:text;
        -webkit-text-fill-color:transparent; animation:rainbow 3s ease infinite;
      }
      @keyframes rainbow { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
    </style>
  </head>
  <body>
    <!-- corner tag: fixed top-left, rounded pill -->
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">Cuphead - Made by Project: Daylight</div>

    <div id="loading-text"
      style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">LOADING...</div>
    <div id="gameContainer"></div>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var loadingText = document.querySelector("#loading-text");
      // This build is ~2.1GB. To avoid ERR_BLOB_OUT_OF_MEMORY we DON'T read parts into
      // ArrayBuffers or use the Cache API (each would hold a full 2.1GB copy in memory).
      // Instead each part is kept as a disk-backed Blob (response.blob()) and the final blob
      // is composed FROM those blobs by reference, so the bytes never all sit in RAM at once.
      let partsDone = 0;
      const totalParts = 103 + 2 + 3;

      async function fetchBlob(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error("fetch failed " + url + " (" + response.status + ")");
        const b = await response.blob();
        partsDone++;
        loadingText.textContent = `LOADING... ${partsDone} / ${totalParts} parts`;
        return b;
      }

      async function mergeFiles(fileParts, cacheKey) {
        // fetch sequentially (not Promise.all) to keep peak memory low
        const blobs = [];
        for (const part of fileParts) { blobs.push(await fetchBlob(part)); }
        return URL.createObjectURL(new Blob(blobs));
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
        return parts;
      }

      (async () => {
        const [dataUrl, wasmUrl, asmUrl] = await Promise.all([
          mergeFiles(getParts("Build/CupheadPort.data.unityweb", 1, 103), "CupheadPort.data.unityweb"),
          mergeFiles(getParts("Build/CupheadPort.wasm.code.unityweb", 1, 2), "CupheadPort.wasm.code.unityweb"),
          mergeFiles(getParts("Build/CupheadPort.asm.code.unityweb", 1, 3), "CupheadPort.asm.code.unityweb"),
        ]);

        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          if (typeof url === "string") {
            if (url.includes("CupheadPort.data.unityweb")) { url = dataUrl; }
            else if (url.includes("CupheadPort.wasm.code.unityweb")) { url = wasmUrl; }
            else if (url.includes("CupheadPort.asm.code.unityweb")) { url = asmUrl; }
          }
          return originalOpen.call(this, method, url, ...rest);
        };
        var unityInstance = UnityLoader.instantiate("gameContainer", "Build/CupheadPort.json");
        loadingText.style.display = "none";
      })();
    </script>
  </body>
</html>
