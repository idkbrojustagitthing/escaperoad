  <!-- Block the multiplayer region-server pings (<region>.<host>) that don't exist on our host and
       retry-flood the browser (ERR_INSUFFICIENT_RESOURCES) — instant-fail them so the game loads offline. -->
  <script>
    (function(){
      var mainHost = location.hostname;
      function isRegion(url){
        try{ var h = new URL(url, location.href).host; return mainHost && h !== mainHost && h.endsWith("." + mainHost); }catch(e){ return false; }
      }
      window.__isRegionBlocked = isRegion;
      var _open = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(m, url){
        if(typeof url === "string" && isRegion(url)){ arguments[1] = "data:text/plain,"; }
        return _open.apply(this, arguments);
      };
      if(window.fetch){
        var _fetch = window.fetch.bind(window);
        window.fetch = function(input, init){
          var url = typeof input === "string" ? input : (input && input.url) || "";
          if(isRegion(url)) return Promise.reject(new Error("region blocked"));
          return _fetch(input, init);
        };
      }
      var _WS = window.WebSocket;
      if(_WS){
        window.WebSocket = function(url, protocols){
          if(isRegion(url)) throw new Error("region blocked");
          return protocols===undefined ? new _WS(url) : new _WS(url, protocols);
        };
        window.WebSocket.prototype = _WS.prototype;
        try{ window.WebSocket.CONNECTING=0; window.WebSocket.OPEN=1; window.WebSocket.CLOSING=2; window.WebSocket.CLOSED=3; }catch(e){}
      }
    })();
  </script>

  <!-- Drop Content-Type header on XHR (avoids a CORS preflight jsDelivr rejects) + force crossOrigin on images (WebGL textures) -->
  <script>
    (function(){
      var _sh = XMLHttpRequest.prototype.setRequestHeader;
      XMLHttpRequest.prototype.setRequestHeader = function(n,v){ if(String(n).toLowerCase()==="content-type") return; return _sh.apply(this, arguments); };
      try{
        var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
        Object.defineProperty(HTMLImageElement.prototype, "src", { configurable:true,
          get:function(){ return d.get.call(this); },
          set:function(v){ try{ if(!this.crossOrigin) this.crossOrigin="anonymous"; }catch(e){} d.set.call(this, v); } });
      }catch(e){}
    })();
  </script>

  <!-- Stub the CrazyGames + AdinPlay ad SDKs so the game runs clean/ad-free without erroring -->
  <script>
    // analytics/site globals the game calls (normally from the stripped site scripts) — no-op
    window.SendEvent = function(){};
    window.gtag = function(){};
    window.dataLayer = window.dataLayer || [];
    window.aCo = 'US';

    // AdinPlay
    window.aiptag = { cmd: { display: { push:function(f){ try{ f&&f(); }catch(e){} } }, player: { push:function(f){ try{ f&&f(); }catch(e){} } } } };
    window.aipDisplayTag = { display:function(){} };
    window.aipPlayer = null;

    // CrazyGames SDK v2 (window.CrazyGames.SDK) — data backed by localStorage, everything else no-op
    var _cgData = {
      getItem:function(k){ try{ return localStorage.getItem("CG_"+k); }catch(e){ return null; } },
      setItem:function(k,v){ try{ localStorage.setItem("CG_"+k, v); }catch(e){} },
      removeItem:function(k){ try{ localStorage.removeItem("CG_"+k); }catch(e){} },
      clear:function(){}
    };
    window.CrazyGames = {
      SDK: {
        init:function(){ return Promise.resolve(); },
        environment:"local", isQaTool:false,
        game:{ gameplayStart:function(){}, gameplayStop:function(){}, sdkGameLoadingStart:function(){}, sdkGameLoadingStop:function(){},
               loadingStart:function(){}, loadingStop:function(){}, happytime:function(){},
               inviteLink:function(){ return Promise.resolve(""); }, showInviteButton:function(){}, hideInviteButton:function(){} },
        ad:{ requestAd:function(type, cb){ try{ cb&&cb.adStarted&&cb.adStarted(); cb&&cb.adFinished&&cb.adFinished(); }catch(e){} }, hasAdblock:function(){ return Promise.resolve(false); } },
        banner:{ requestBanner:function(){ return Promise.resolve(); }, requestResponsiveBanner:function(){ return Promise.resolve(); }, clearBanner:function(){}, clearAllBanners:function(){} },
        data:_cgData,
        user:{ isUserAccountAvailable:false, getUser:function(){ return Promise.resolve(null); }, getUserToken:function(){ return Promise.resolve(""); },
               addAuthListener:function(){}, removeAuthListener:function(){}, showAuthPrompt:function(){ return Promise.resolve(null); },
               addScreenChangeListener:function(){}, removeScreenChangeListener:function(){} }
      }
    };

    // gCrazySDK — the game's own wrapper (normally from the site's ad tag); provide broad no-ops
    window.gCrazySDK = {
      init:function(){ return Promise.resolve(); },
      clearAllBanners:function(){}, clearBanner:function(){}, requestBanner:function(){}, requestResponsiveBanner:function(){},
      gameplayStart:function(){}, gameplayStop:function(){}, happytime:function(){},
      gameLoadingStart:function(){}, gameLoadingStop:function(){}, sdkGameLoadingStart:function(){}, sdkGameLoadingStop:function(){},
      requestAd:function(t,s,e,c){ try{ s&&s(); c&&c(); }catch(x){} },
      midgame:function(cb){ try{ cb&&cb(); }catch(x){} }, rewarded:function(s,e,c){ try{ e&&e(); }catch(x){} },
      hasAdblock:function(){ return false; }, isAdBlocked:function(){ return false; },
      getData:_cgData.getItem, setData:_cgData.setItem, save:function(){}, load:function(){}
    };
  </script>
