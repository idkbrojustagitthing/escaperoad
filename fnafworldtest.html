<!DOCTYPE html>
<html lang="en">
<head>
  <!-- base href trick: relative paths resolve to the game's folder on jsDelivr (Cloudflare-only host).
       SHA-pinned to web-ports/fnaf-world-refreshed (immutable). Not self-hosted (~653MB).
       Clickteam Fusion 2.5 HTML5 game: Runtime.js loads the .cch + resources relatively (resolves
       against this base href) and sets crossOrigin itself, so jsDelivr (ACAO:*) works with no patch. -->
  <base href="https://testingcf.jsdelivr.net/gh/web-ports/fnaf-world-refreshed@5ad15720ba66d73ff80d7fa9d7a4cbf4a297e7ae/">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, target-densitydpi=device-dpi" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="HandheldFriendly" content="true" />
  <title>Denton ISD</title>

  <!-- Lock the tab title: Clickteam Fusion sets document.title to the frame name ("Warning Screen"...).
       Make the title setter a no-op so the tab stays "Denton ISD". -->
  <script>
    (function(){
      var TITLE = "Denton ISD";
      try {
        Object.defineProperty(Document.prototype, "title", {
          get: function(){ return TITLE; },
          set: function(){ /* ignore the game's title; keep Denton ISD */ },
          configurable: true
        });
      } catch(e){
        setInterval(function(){ if (document.title !== TITLE) document.title = TITLE; }, 500);
      }
    })();
  </script>

  <style type="text/css">
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#7fa8d6; }
    body { display:flex; align-items:center; justify-content:center; }
    #MMFCanvas {
      display:block; background:#7fa8d6;
      width: min(100vw, calc(100vh * (800/480))) !important;
      height: min(100vh, calc(100vw * (480/800))) !important;
    }
  </style>
  <!-- Loads the Clickteam Fusion HTML5 runtime -->
  <script src="src/Runtime.js"></script>
</head>

<body>
  <!-- corner tag: fixed top-left, rounded pill -->
  <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 12px; z-index: 2000000000; border: 1px solid rgba(80,150,255,0.6);">FNaF World Refreshed - Made by Project: Daylight</div>

  <canvas id="MMFCanvas" width="800" height="480">
    Your browser does not support Canvas.
  </canvas>

  <script>
    // RUNTIMESTART
    window.addEventListener("load", windowLoaded, false);
    function windowLoaded() {
      // First parameter : canvas element id
      // Second parameter : path to the .cch file (images and sounds lie beside it in resources/)
      new Runtime("MMFCanvas", "resources/fnaf-world-refreshed.cch");
    }
    // RUNTIMESTARTEND
  </script>
</body>
</html>
